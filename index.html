<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sinecdo — Deployment Test</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #171918;
      color: #f3f1eb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(760px, 100%);
      border: 1px solid rgba(243,241,235,.16);
      border-radius: 20px;
      padding: clamp(28px, 6vw, 64px);
      background: rgba(255,255,255,.025);
    }
    .signal {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #63e6d2;
      box-shadow: 0 0 28px rgba(99,230,210,.7);
      margin-bottom: 28px;
    }
    h1 { margin: 0 0 16px; font-size: clamp(40px, 8vw, 80px); letter-spacing: -.06em; }
    p { margin: 0; max-width: 55ch; font-size: clamp(16px, 2vw, 20px); line-height: 1.55; color: rgba(243,241,235,.72); }
    strong { color: #63e6d2; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="signal" aria-hidden="true"></div>
    <h1>sinecdo</h1>
    <p><strong>Deploy OK.</strong> GitHub está listo. Esta página es únicamente una prueba técnica previa a la Landing MVP Conference Ready.</p>
  </main>
</body>
</html>
