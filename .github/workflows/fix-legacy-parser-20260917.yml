name: Fix legacy Apps Script parser
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-legacy-parser-20260917.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/intake.php')
          s=p.read_text()
          old="""function parse_legacy_response(string $html,string $requestId):bool{if(!preg_match('/window\\.parent\\.postMessage\\((\\{.*?\\})\\s*,\\s*[\"\\']\\*[\"\\']\\s*\\)/s',$html,$m))return false;$d=json_decode($m[1],true);return is_array($d)&&($d['source']??'')==='sinecdo-lead'&&($d['ok']??false)===true&&(string)($d['requestId']??'')===$requestId;}"""
          new="""function parse_legacy_response(string $html,string $requestId):bool{$check=static function(string $text)use($requestId):bool{if(!preg_match('/window\\.parent\\.postMessage\\((\\{.*?\\})\\s*,\\s*[\"\\']\\*[\"\\']\\s*\\)/s',$text,$m))return false;$d=json_decode($m[1],true);return is_array($d)&&($d['source']??'')==='sinecdo-lead'&&($d['ok']??false)===true&&(string)($d['requestId']??'')===$requestId;};if($check($html))return true;$decoded=$html;for($i=0;$i<4;$i++){$next=stripcslashes($decoded);if($next===$decoded)break;$decoded=$next;if($check($decoded))return true;}return strpos($decoded,'sinecdo-lead')!==false&&strpos($decoded,$requestId)!==false&&preg_match('/[\"\\']?ok[\"\\']?\\s*:\\s*true/',$decoded)===1&&preg_match('/[\"\\']?code[\"\\']?\\s*:\\s*[\"\\']ok[\"\\']/',$decoded)===1;}"""
          if s.count(old)!=1:
              raise SystemExit(f'Expected one old parser, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          php -l api/intake.php
      - name: Validate parser against real harmless Google wrapper
        run: |
          set -euo pipefail
          RID='qa-honeypot-parser-20260917-abcdef123456'
          curl -sS -L --max-redirs 5 -o /tmp/body.html \
            -H 'Content-Type: application/x-www-form-urlencoded;charset=UTF-8' \
            --data-urlencode "request_id=$RID" \
            --data-urlencode 'website_check=bot-test-do-not-store' \
            'https://script.google.com/macros/s/AKfycbzM62i0CqEVCqH7oxFj3wBsjqB0Ry2Pza6Zi9e5jUiUGwi4OD-S_pArMURvk62qdxQL1A/exec'
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('api/intake.php').read_text()
          m=re.search(r'(function parse_legacy_response.*?)(?=function legacy_payload)',s,re.S)
          if not m: raise SystemExit('parser function not found')
          Path('/tmp/test-parser.php').write_text('<?php\n'+m.group(1)+"\n$html=file_get_contents('/tmp/body.html');$rid='qa-honeypot-parser-20260917-abcdef123456';if(!parse_legacy_response($html,$rid)){fwrite(STDERR,'parser failed\\n');exit(1);}echo 'parser ok\\n';")
          PY
          php /tmp/test-parser.php
      - name: Commit parser fix
        run: |
          git config user.name 'Sinecdo Web Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add api/intake.php
          git commit -m 'fix: confirm Apps Script wrapped responses'
          git push
