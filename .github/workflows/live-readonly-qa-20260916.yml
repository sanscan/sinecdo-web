name: Sinecdo live read-only QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-readonly-qa-20260916.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Hostinger deploy
        run: sleep 45
      - name: Verify ES EN IT and Quest
        run: |
          set -euo pipefail
          ROOT="$(curl -fsSL --retry 8 --retry-delay 6 'https://sinecdo.com/?qa=release-20260916')"
          EN="$(curl -fsSL --retry 6 --retry-delay 5 'https://sinecdo.com/en/?qa=release-20260916')"
          IT="$(curl -fsSL --retry 6 --retry-delay 5 'https://sinecdo.com/it/?qa=release-20260916')"
          QUEST="$(curl -fsSL --retry 6 --retry-delay 5 'https://sinecdo.com/quest/?lang=es&qa=release-20260916')"
          echo "$ROOT" | grep -q 'SINECDO / QUIZ'
          echo "$ROOT" | grep -q '/assets/quiz/capture.js'
          echo "$EN" | grep -q 'Take our quiz'
          echo "$IT" | grep -q 'Fai il quiz'
          echo "$QUEST" | grep -q 'quest-root'
          CODE="$(curl -sS -o /tmp/api.json -w '%{http_code}' 'https://sinecdo.com/api/intake.php')"
          test "$CODE" = '405'
          echo 'Live read-only QA passed.'
