name: Brand v0.6 live QA
on:
  push:
    paths:
      - '.github/workflows/brand-v06-live-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Hostinger deploy
        run: sleep 20
      - name: Validate production branding
        run: |
          set -e
          HTML="$(curl -fsSL --retry 6 --retry-delay 5 'https://sinecdo.com/?qa=brand-v06-20260902')"
          echo "$HTML" | grep -q '20260902-brand-v06'
          CSS="$(curl -fsSL --retry 4 'https://sinecdo.com/styles.css?v=20260902-brand-v06')"
          FORM="$(curl -fsSL --retry 4 'https://sinecdo.com/form.css?v=20260902-brand-v06')"
          FAV="$(curl -fsSL --retry 4 'https://sinecdo.com/brand/sinecdo/favicon.svg?v=20260902-brand-v06')"
          echo "$CSS$FORM" | grep -q '#63E6D2'
          if echo "$CSS$FORM" | grep -Eiq '#00f3f8|rgba\(0, ?243, ?248'; then echo 'Old aqua still active'; exit 1; fi
          echo "$FAV" | grep -q '#121514'
          echo "$FAV" | grep -q '#63E6D2'
          echo "$FAV" | grep -q 'rx="34"'
      - name: Self-clean workflow
        run: |
          git config user.name "Sinecdo Web Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/brand-v06-live-qa.yml
          git commit -m "Remove one-shot brand v0.6 QA"
          git push
