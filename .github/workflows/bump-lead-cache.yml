name: Bump lead capture cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache key once
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          old = 'lead-capture.js?v=restore-20260831-1'
          new = 'lead-capture.js?v=restore-final-20260831-2'
          if old in text:
              p.write_text(text.replace(old, new))
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo 'No cache bump needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump lead capture cache key'
          git push
