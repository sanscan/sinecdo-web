name: Footer legal cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/footer-legal-cleanup.yml'

permissions:
  contents: write

jobs:
  patch-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace Conference Ready footer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<span>Consultora creativa y comercial · Conference Ready 2026</span>'
          new = '<span>© 2026 Sinecdo · Todos los derechos reservados · Diseñado por Sinecdo</span>'
          if old not in s:
              raise SystemExit('Expected Conference Ready footer text not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit footer and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/footer-legal-cleanup.yml
          git commit -m "fix: replace Conference Ready footer with legal footer"
          git push origin main
