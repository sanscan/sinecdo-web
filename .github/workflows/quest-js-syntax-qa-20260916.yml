name: Quest JS syntax QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quest-js-syntax-qa-20260916.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          node --check assets/quiz/capture.js
          node --check assets/quiz/quest.js
          node --check assets/quiz/direct-form.js
          node --check assets/i18n/site-i18n.js
