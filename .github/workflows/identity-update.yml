name: Apply approved Sinecdo identity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch approved identity references
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()

          marker = '  <title>Sinecdo — Consultora creativa y comercial</title>\n'
          fav = '''  <title>Sinecdo — Consultora creativa y comercial</title>
          <link rel="icon" href="/brand/sinecdo/favicon.svg?v=20260831" type="image/svg+xml">
          <link rel="icon" href="/brand/sinecdo/favicon-16.svg?v=20260831" sizes="16x16" type="image/svg+xml">
          <link rel="icon" href="/brand/sinecdo/favicon-32.svg?v=20260831" sizes="32x32" type="image/svg+xml">
          <link rel="icon" href="/brand/sinecdo/favicon-48.svg?v=20260831" sizes="48x48" type="image/svg+xml">
          <link rel="icon" href="/brand/sinecdo/favicon-64.svg?v=20260831" sizes="64x64" type="image/svg+xml">
          '''
          if '/brand/sinecdo/favicon.svg' not in html:
              assert marker in html
              html = html.replace(marker, fav, 1)

          old_header = '      <a class="brand" href="#top" aria-label="Sinecdo, inicio">sinecdo</a>'
          new_header = '''      <a class="brand" href="#top" aria-label="Sinecdo, inicio">
                  <img class="brand-logo" src="/brand/sinecdo/sinecdo-lockup-horizontal-dark-bg.svg?v=20260831" alt="Sinecdo" width="293.382" height="80">
                </a>'''
          assert old_header in html or new_header in html
          html = html.replace(old_header, new_header)

          old_footer = '      <strong>sinecdo</strong>'
          new_footer = '''      <a class="footer-brand" href="#top" aria-label="Sinecdo, inicio">
                  <img class="footer-brand-logo" src="/brand/sinecdo/sinecdo-lockup-horizontal-dark-bg.svg?v=20260831" alt="Sinecdo" width="293.382" height="80">
                </a>'''
          assert old_footer in html or new_footer in html
          html = html.replace(old_footer, new_footer)

          html = html.replace('href="styles.css"', 'href="styles.css?v=identity-20260831"')
          html = html.replace('href="form.css"', 'href="form.css?v=identity-20260831"')
          index.write_text(html)

          styles = Path('styles.css')
          css = styles.read_text()
          old_brand = '''.brand {
            text-decoration: none;
            font-size: 25px;
            font-weight: 760;
            letter-spacing: -.055em;
          }
          '''
          new_brand = '''.brand {
            display: inline-flex;
            align-items: center;
            flex: 0 0 auto;
            text-decoration: none;
            line-height: 0;
          }

          .brand-logo {
            display: block;
            width: clamp(132px, 12vw, 160px);
            height: auto;
            aspect-ratio: 293.382 / 80;
          }
          '''
          assert old_brand in css or new_brand in css
          css = css.replace(old_brand, new_brand)

          old_footer_css = '.footer-row strong { color: var(--stone); font-size: 18px; letter-spacing: -.04em; }\n'
          new_footer_css = '''.footer-brand {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            line-height: 0;
          }

          .footer-brand-logo {
            display: block;
            width: 138px;
            height: auto;
            aspect-ratio: 293.382 / 80;
          }
          '''
          assert old_footer_css in css or new_footer_css in css
          css = css.replace(old_footer_css, new_footer_css)

          mobile_marker = '''@media (max-width: 720px) {
            .wrap { width: min(calc(100% - 28px), var(--max)); }
            .nav { min-height: 64px; }
          '''
          mobile_new = '''@media (max-width: 720px) {
            .wrap { width: min(calc(100% - 28px), var(--max)); }
            .nav { min-height: 64px; }
            .brand-logo { width: 132px; }
            .footer-brand-logo { width: 126px; }
          '''
          assert mobile_marker in css or mobile_new in css
          css = css.replace(mobile_marker, mobile_new)
          styles.write_text(css)

          form = Path('form.css')
          form_css = form.read_text()
          old_import = "@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap');"
          new_import = "@import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=JetBrains+Mono:wght@500;600;700&display=swap');"
          if old_import in form_css:
              form_css = form_css.replace(old_import, new_import, 1)
          elif new_import not in form_css:
              form_css = new_import + '\n\n' + form_css
          form.write_text(form_css)

          required = [
              'brand/sinecdo/sinecdo-lockup-horizontal-dark-bg.svg',
              'brand/sinecdo/sinecdo-lockup-horizontal-light-bg.svg',
              'brand/sinecdo/sinecdo-symbol-master-aqua.svg',
              'brand/sinecdo/sinecdo-symbol-master-currentColor.svg',
              'brand/sinecdo/favicon.svg',
              'brand/sinecdo/favicon-16.svg',
              'brand/sinecdo/favicon-32.svg',
              'brand/sinecdo/favicon-48.svg',
              'brand/sinecdo/favicon-64.svg',
          ]
          assert all(Path(p).exists() for p in required)
          check = index.read_text()
          assert '>sinecdo</a>' not in check
          assert '<strong>sinecdo</strong>' not in check
          assert '/brand/sinecdo/favicon.svg' in check
          assert check.count('sinecdo-lockup-horizontal-dark-bg.svg') >= 2

          wf = Path('.github/workflows/identity-update.yml')
          if wf.exists():
              wf.unlink()
          PY
      - name: Commit identity update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update Sinecdo logo favicon and brand references'
          git push
