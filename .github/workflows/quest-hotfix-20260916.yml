name: Quest hotfix blank screen
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quest-hotfix-20260916.yml'
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove extra brace and validate JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/quiz/quest.js')
          s=p.read_text()
          old="active:'Il prossimo passo proposto sarebbe compilare una richiesta di analisi con il contesto del tuo progetto.'}}\n};"
          new="active:'Il prossimo passo proposto sarebbe compilare una richiesta di analisi con il contesto del tuo progetto.'}\n};"
          if s.count(old)!=1:
              raise SystemExit(f'Expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check assets/quiz/capture.js
          node --check assets/quiz/quest.js
          node --check assets/quiz/direct-form.js
          node --check assets/i18n/site-i18n.js
      - name: Commit hotfix
        run: |
          git config user.name "Sinecdo Web Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/quiz/quest.js
          git commit -m "fix: render Quest after locale object syntax error"
          git push
