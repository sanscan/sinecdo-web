name: Sinecdo identity live QA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Hostinger deploy and validate live assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          ok=0
          for i in $(seq 1 36); do
            stamp=$(date +%s)
            if curl -fsSL "https://sinecdo.com/?brand-qa=${stamp}" -o qa/live.html; then
              if grep -q '/brand/sinecdo/sinecdo-lockup-horizontal-dark-bg.svg' qa/live.html && grep -q '/brand/sinecdo/favicon.svg' qa/live.html; then
                ok=1
                break
              fi
            fi
            echo "Waiting for Hostinger deploy ($i/36)..."
            sleep 10
          done
          test "$ok" -eq 1

          grep -q 'class="brand-logo"' qa/live.html
          grep -q 'class="footer-brand-logo"' qa/live.html
          grep -q 'favicon-16.svg' qa/live.html
          grep -q 'favicon-32.svg' qa/live.html
          ! grep -q '>sinecdo</a>' qa/live.html
          ! grep -q '<strong>sinecdo</strong>' qa/live.html

          declare -a assets=(
            'sinecdo-lockup-horizontal-dark-bg.svg'
            'sinecdo-lockup-horizontal-light-bg.svg'
            'sinecdo-symbol-master-aqua.svg'
            'sinecdo-symbol-master-currentColor.svg'
            'favicon.svg'
            'favicon-16.svg'
            'favicon-32.svg'
            'favicon-48.svg'
            'favicon-64.svg'
          )
          for asset in "${assets[@]}"; do
            curl -fsSL -D "qa/${asset}.headers.txt" "https://sinecdo.com/brand/sinecdo/${asset}?v=20260831" -o "qa/${asset}"
            test -s "qa/${asset}"
          done

          grep -q '#00F3F8' qa/sinecdo-lockup-horizontal-dark-bg.svg
          grep -q '#FFFFFF' qa/sinecdo-lockup-horizontal-dark-bg.svg
          grep -q '#05090C' qa/sinecdo-lockup-horizontal-light-bg.svg
          grep -q 'viewBox="0 0 293.382 80"' qa/sinecdo-lockup-horizontal-dark-bg.svg
          grep -q 'viewBox="0 0 180 180"' qa/favicon.svg

          grep -o '<link rel="icon"[^>]*>' qa/live.html > qa/favicon-head-tags.txt || true
          printf 'Live URL: https://sinecdo.com/\nValidated at: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > qa/qa-summary.txt

      - name: Capture desktop mobile and favicon proof
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "Using $CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=qa/desktop.png 'https://sinecdo.com/?brand-qa=desktop-20260831'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=qa/mobile.png 'https://sinecdo.com/?brand-qa=mobile-20260831'

          cat > qa/favicon-proof.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><style>
          html,body{margin:0;width:100%;height:100%;background:#05090C;color:#fff;font-family:Arial,sans-serif}
          body{display:grid;place-items:center}.panel{display:grid;grid-template-columns:128px 1fr;gap:28px;align-items:center;padding:32px;border:1px solid #2a3135;border-radius:22px;background:#0d1317;max-width:620px}
          img{width:128px;height:128px}.k{font:12px monospace;color:#00F3F8;letter-spacing:.12em}.t{font-size:28px;font-weight:700;margin:8px 0}.s{color:#aeb6ba;line-height:1.5}
          </style></head><body><div class="panel"><img src="https://sinecdo.com/brand/sinecdo/favicon.svg?v=20260831" alt="Sinecdo favicon"><div><div class="k">FAVICON / LIVE ASSET</div><div class="t">Sinecdo favicon.svg</div><div class="s">Live asset loaded from sinecdo.com and declared in the production &lt;head&gt;.</div></div></div></body></html>
          HTML
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=760,360 --screenshot=qa/favicon-proof.png "file://${GITHUB_WORKSPACE}/qa/favicon-proof.html"

      - name: Capture browser chrome with favicon if possible
        shell: bash
        continue-on-error: true
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick xvfb >/dev/null
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          xvfb-run -a bash -c '
            set -e
            '"$CHROME"' --no-sandbox --disable-gpu --no-first-run --no-default-browser-check --user-data-dir=/tmp/sinecdo-brand-qa --window-size=1200,800 "https://sinecdo.com/?brand-qa=browser-favicon-20260831" >/tmp/chrome-qa.log 2>&1 &
            pid=$!
            sleep 8
            import -window root "'"$GITHUB_WORKSPACE"'/qa/browser-favicon.png"
            kill $pid || true
          '

      - uses: actions/upload-artifact@v4
        with:
          name: sinecdo-identity-live-qa
          path: qa/
          if-no-files-found: error
          retention-days: 14

      - name: Remove one-shot QA workflow
        if: always()
        shell: bash
        run: |
          set -e
          rm -f .github/workflows/identity-live-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-shot identity live QA workflow'
            git push
          fi
