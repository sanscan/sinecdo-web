name: Normalize brand v0.6
on:
  push:
    paths:
      - '.github/workflows/normalize-brand-v06.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize CSS and favicon
        run: |
          python - <<'PY'
          from pathlib import Path

          styles = Path('styles.css')
          s = styles.read_text()
          s = s.replace('--aqua: #00f3f8;', '--aqua: #63E6D2;')
          s = s.replace('--aqua-soft: rgba(0, 243, 248, .12);', '--aqua-soft: rgba(99, 230, 210, .12);')
          s = s.replace('--aqua-line: rgba(0, 243, 248, .34);', '--aqua-line: rgba(99, 230, 210, .34);')
          s = s.replace('rgba(0, 243, 248,', 'rgba(99, 230, 210,')
          s = s.replace('rgba(0,243,248,', 'rgba(99,230,210,')
          s = s.replace('  color: var(--stone);\n  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;\n  font-optical-sizing: auto;\n  font-size: 16px;', '  color: var(--stone);\n  font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;\n  font-size: 16px;', 1)
          s = s.replace('font-family: Georgia, "Times New Roman", serif;', 'font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;')
          s = s.replace('font: 12px Inter, system-ui, sans-serif;', 'font: 12px "DM Sans", system-ui, sans-serif;')
          old = '''/* Canonical H2 / wordmark typography */\n.section-title {\n  max-width: 860px;\n  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;\n  font-optical-sizing: auto;\n  font-weight: var(--brand-word-weight);\n  letter-spacing: var(--brand-word-tracking);\n  line-height: var(--brand-word-leading);'''
          new = '''/* Editorial H2 base. Final hierarchy is reinforced in typography.css. */\n.section-title {\n  max-width: 860px;\n  font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;\n  font-weight: 780;\n  letter-spacing: -.025em;\n  line-height: .98;'''
          s = s.replace(old, new)
          s = s.replace("sinecdo-symbol-master-aqua.svg?v=20260901-final-inter760", "sinecdo-symbol-master-aqua.svg?v=20260902-brand-v06")
          styles.write_text(s)

          form = Path('form.css')
          f = form.read_text()
          f = f.replace('rgba(0, 243, 248,', 'rgba(99, 230, 210,')
          f = f.replace('rgba(0,243,248,', 'rgba(99,230,210,')
          form.write_text(f)

          # Latest user-approved favicon: rounded Graphite tile + aqua S, with extra optical air.
          paths = '''<path d="M155 26 H90 C60 26 36 49 36 77 C36 90 41 100 50 107 L75 104 V85 C75 75 82 69 93 69 H123 C141 69 155 53 155 35 Z"/><path d="M139 81 L115 84 V104 C115 114 108 119 99 119 H66 C47 119 34 135 34 155 V162 H108 C134 162 155 140 155 113 C155 100 149 89 139 81 Z"/>'''
          def favicon(size=None):
              wh = '' if size is None else f' width="{size}" height="{size}"'
              return f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"{wh} role="img" aria-label="Sinecdo favicon rounded graphite"><rect x="2" y="2" width="176" height="176" rx="34" fill="#121514"/><g transform="translate(20.1 20.4) scale(.74)" fill="#63E6D2">{paths}</g></svg>\n'''
          Path('brand/sinecdo/favicon.svg').write_text(favicon())
          for n in (16,32,48,64):
              Path(f'brand/sinecdo/favicon-{n}.svg').write_text(favicon(n))

          index = Path('index.html')
          h = index.read_text()
          h = h.replace('20260901-dmsans-editorial-v4', '20260902-brand-v06')
          index.write_text(h)
          PY

          git config user.name "Sinecdo Web Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/normalize-brand-v06.yml
          git add styles.css form.css index.html brand/sinecdo/favicon.svg brand/sinecdo/favicon-16.svg brand/sinecdo/favicon-32.svg brand/sinecdo/favicon-48.svg brand/sinecdo/favicon-64.svg
          git commit -m "Normalize canonical brand v0.6"
          git push
