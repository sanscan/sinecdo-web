name: Bump favicon cache
on:
  push:
    paths:
      - '.github/workflows/bump-favicon-cache.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bump favicon query versions
        run: |
          sed -i 's/favicon.svg?v=20260831/favicon.svg?v=20260901-circle/g' index.html
          sed -i 's/favicon-16.svg?v=20260831/favicon-16.svg?v=20260901-circle/g' index.html
          sed -i 's/favicon-32.svg?v=20260831/favicon-32.svg?v=20260901-circle/g' index.html
          sed -i 's/favicon-48.svg?v=20260831/favicon-48.svg?v=20260901-circle/g' index.html
          sed -i 's/favicon-64.svg?v=20260831/favicon-64.svg?v=20260901-circle/g' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump favicon cache for circular graphite icon [skip ci]'
          git rm .github/workflows/bump-favicon-cache.yml
          git commit -m 'Remove one-shot favicon cache workflow [skip ci]'
          git push origin main
