name: Publish and verify intake parser
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-intake-deploy-20260917.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add operational version header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/intake.php')
          s=p.read_text()
          old="header('Content-Type: application/json; charset=utf-8');header('Cache-Control: no-store');header('X-Content-Type-Options: nosniff');"
          new=old+"header('X-Sinecdo-Intake-Version: legacy-parser-2');"
          if 'X-Sinecdo-Intake-Version' not in s:
              if s.count(old)!=1: raise SystemExit('header target not found exactly once')
              p.write_text(s.replace(old,new,1))
          PY
          php -l api/intake.php
      - name: Commit version marker
        run: |
          git config user.name 'Sinecdo Web Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add api/intake.php
          if ! git diff --cached --quiet; then
            git commit -m 'chore: expose intake parser version header'
            git push
          fi
      - name: Wait for Hostinger and verify deployed PHP
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            curl -sS -D /tmp/h -o /tmp/b 'https://sinecdo.com/api/intake.php' || true
            if grep -qi '^x-sinecdo-intake-version: legacy-parser-2' /tmp/h; then
              grep -q '"code":"method"' /tmp/b
              echo 'Parser v2 is live on Hostinger.'
              exit 0
            fi
            sleep 10
          done
          echo 'Parser v2 marker not live in time' >&2
          cat /tmp/h >&2 || true
          exit 1
